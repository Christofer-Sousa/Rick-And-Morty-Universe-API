<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Rick and Morty Universe</title>
</head>

<body class="bg-zinc-950 text-zinc-100 font-sans">
    <main class="text-white w-full flex flex-col gap-3">
        <!--MENU section-->
        <header class="w-full flex items-center gap-5 h-min-5 bg-zinc-950 p-3 rounded-lg border border-zinc-800">
            <div>
                <img class="w-16" src="./scr/portal-logo.png" alt="">
            </div>

            <div class="w-full flex items-center justify-between">
                <div>
                    <h1 class="font-bold text-xl">RICK AND MORTY</h1>
                    <p class="text-green-400 text-sm">EXPLORER</p>
                </div>
                <div class="text-4xl">
                    &#9776;
                </div>
            </div>
        </header>

        <!--HEADER section-->
        <section class="w-full flex flex-col text-sm bg-zinc-950 p-3 rounded-lg gap-3 border border-zinc-800">
            <div>
                <p class="text-zinc-400">Explore the multiverse and discover characters.</p>
            </div>

            <!--SEARCH section-->
            <div class="flex gap-4 items-center border border-zinc-800 rounded-full px-3 py-2 bg-zinc-900">
                <span class="text-lg">&#128269;</span>
                <input class="w-full outline-none bg-transparent" type="text" placeholder="Search character..." id="search-bar">
            </div>

            <!--FILTER section-->
            <div id="filter-buttons" class="flex gap-3 items-center self-center">
                <button id="all" class="border border-zinc-800 px-4 py-1 rounded-xl">All</button>
                <button id="Alive" class="border border-zinc-800 px-4 py-1 rounded-xl">Alive</button>
                <button id="Dead" class="border border-zinc-800 px-4 py-1 rounded-xl">Dead</button>
                <button id="unknown" class="border border-zinc-800 px-4 py-1 rounded-xl">Unknown</button>
            </div>
        </section>

        <!--CARDS section-->
        <section class="w-full grid grid-cols-2 text-sm bg-zinc-950 p-3 rounded-lg gap-3 border border-zinc-800"
            id="cards-section">

        </section>

        <section id="pagination" class="w-full flex justify-around items-center text-sm bg-zinc-950 p-3 rounded-lg gap-3 border border-zinc-800 mb-4">
            <button id="previous">&#8592; Previous</button>
            <button id="next">Next &#8594;</button>
        </section>
    </main>

</body>
<script src="./js/script.js"></script>

</html>
